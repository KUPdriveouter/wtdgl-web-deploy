<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>데스게임 랜드에 어서오세요!</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090b14}
    body{display:grid;place-items:center;font-family:system-ui,sans-serif}
    #unity-container{position:relative;width:100vw;height:100vh;height:100dvh;box-shadow:0 0 60px #000}
    #unity-canvas{display:block;width:100%;height:100%;background:#090b14;image-rendering:auto}
    #loading{position:absolute;inset:0;display:grid;place-items:center;color:#f2e7cf;background:#090b14}
    #bar{width:min(360px,60vw);height:8px;margin-top:12px;border:1px solid #705569;border-radius:8px;overflow:hidden}
    #fill{height:100%;width:0;background:#bd334c;transition:width .1s}
    #fullscreen{position:absolute;right:12px;bottom:12px;padding:8px 12px;border:1px solid #8c7181;border-radius:6px;color:#f2e7cf;background:#181423cc;cursor:pointer}
    #warning{position:absolute;left:5%;right:5%;top:5%;z-index:2;color:#fff;text-align:center}
    @media (pointer:coarse){#fullscreen{display:none}}
  </style>
</head>
<body>
  <main id="unity-container">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>
    <div id="loading"><div><strong>데스게임 랜드 입장 중</strong><div id="bar"><div id="fill"></div></div></div></div>
    <div id="warning"></div>
    <button id="fullscreen" type="button">전체 화면</button>
  </main>
  <script>
    const canvas=document.querySelector('#unity-canvas'),loading=document.querySelector('#loading'),warning=document.querySelector('#warning');
    const config={dataUrl:'Build/WebGLSmoke.data',frameworkUrl:'Build/WebGLSmoke.framework.js',codeUrl:'Build/WebGLSmoke.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'WTDGL',productName:'Welcome to Death Game Land!',productVersion:'1.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,2),autoSyncPersistentDataPath:true,showBanner:(message,type)=>{const item=document.createElement('div');item.textContent=message;item.style.cssText='margin:4px;padding:8px;background:'+(type==='error'?'#8b1f31':'#8a6a22');warning.appendChild(item);if(type!=='error')setTimeout(()=>item.remove(),5000)}};
    const loader=document.createElement('script');loader.src='Build/WebGLSmoke.loader.js';loader.onload=()=>createUnityInstance(canvas,config,p=>document.querySelector('#fill').style.width=(p*100)+'%').then(instance=>{loading.remove();document.querySelector('#fullscreen').onclick=()=>instance.SetFullscreen(1)}).catch(message=>{loading.textContent=message});document.body.appendChild(loader);
  </script>
</body>
</html>
